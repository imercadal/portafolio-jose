services:
  app:
    image: node:24-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    stdin_open: true     
    tty: true         